<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ノード編集（新CSV対応版）</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  display:flex;
  height:100vh;
  background:#eef3f9;
  color:#222;
}

.sidebar{
  width:340px;
  background:#fff;
  padding:12px;
  border-right:1px solid #ddd;
  box-sizing:border-box;
  overflow:auto;
}

.sidebar h3{
  margin:0 0 10px;
}

.back-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
  padding:7px 10px;
  border:1px solid #dbeafe;
  border-radius:8px;
  background:#eff6ff;
  color:#2563eb;
  text-decoration:none;
  font-size:13px;
  font-weight:bold;
}

.backup-note{
  margin:10px 0 12px;
  padding:10px 12px;
  border:1px solid #fed7aa;
  border-radius:10px;
  background:#fff7ed;
  color:#9a3412;
  font-size:12px;
  line-height:1.6;
}

.tools{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:10px;
}

button,input,select{
  padding:7px 9px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#fff;
  font-size:13px;
}

button{
  cursor:pointer;
}

button.primary{
  background:#2563eb;
  color:#fff;
  border-color:#2563eb;
}

button.danger{
  color:#dc2626;
  border-color:#fecaca;
}

.note{
  font-size:12px;
  color:#666;
  line-height:1.6;
  margin:8px 0 12px;
}

.node-list{
  list-style:none;
  padding:0;
  margin:0;
}

.node-item{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:8px;
  margin-bottom:8px;
  cursor:pointer;
  background:#fff;
}

.node-item.active{
  border-color:#2563eb;
  background:#eff6ff;
}

.node-title{
  font-weight:bold;
  font-size:13px;
  margin-bottom:4px;
}

.node-meta{
  font-size:12px;
  color:#555;
  line-height:1.5;
}

.editor{
  border-top:1px solid #ddd;
  margin-top:12px;
  padding-top:12px;
}

.editor label{
  display:block;
  font-size:12px;
  margin:8px 0 3px;
  color:#555;
}

.editor input,.editor select{
  width:100%;
  box-sizing:border-box;
}

.map{
  flex:1;
  display:block;
  padding:18px;
  box-sizing:border-box;
  overflow:auto;
}

.map-wrap{
  position:relative;
  width:min(1000px,100%);
  min-width:900px;
  margin:0 auto;
  background:#fff;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

img{
  width:100%;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}

.node{
  position:absolute;
  width:16px;
  height:16px;
  background:#dc2626;
  border:2px solid #fff;
  border-radius:50%;
  transform:translate(-50%, -50%);
  box-shadow:0 3px 8px rgba(0,0,0,0.25);
  cursor:grab;
  z-index:3;
}

.node:active{
  cursor:grabbing;
}

.node.active{
  background:#2563eb;
  width:20px;
  height:20px;
  z-index:5;
}

.node.entrance_node{ background:#0f766e; }
.node.es_up,.node.es_down{ background:#9333ea; }
.node.toilet_node{ background:#0284c7; }
.node.facility{ background:#f59e0b; }

.node-label{
  position:absolute;
  transform:translate(-50%, -145%);
  background:rgba(0,0,0,0.72);
  color:#fff;
  padding:2px 6px;
  border-radius:999px;
  font-size:11px;
  white-space:nowrap;
  pointer-events:none;
  z-index:4;
}

.crosshair{
  cursor:crosshair;
}
</style>
</head>

<body>

<div class="sidebar">
  <a class="back-link" href="./editor-menu.html">← 管理メニューに戻る</a>

  <h3>ノード編集</h3>

  <div class="backup-note">
    <strong>作業前の確認：</strong><br>
    大きな変更を行う前は、管理メニューの「バックアップ管理」から
    nodes_1f.csv / edges_1f.csv / locations_1f.csv の3つを選択し、
    バックアップJSONを作成してください。<br><br>

    <strong>CSV出力後の保存：</strong><br>
    CSV出力後は、ダウンロードされたCSVを
    <strong>mall-map</strong> フォルダ内の同名CSVへ上書きしてください。
  </div>


  <div class="tools">
    <button type="button" class="primary" onclick="loadNodes()">CSV再読込</button>
    <button type="button" onclick="addMode()">新規追加</button>
    <button type="button" onclick="exportCSV()">CSV出力</button>
    <button type="button" class="danger" onclick="deleteSelected()">選択削除</button>
  </div>

  <div class="note">
    対応形式：<br>
    <code>id,floor_id,x,y,type,name</code><br>
    ノードはドラッグで移動できます。地図上クリックで新規追加できます。
  </div>

  <ul class="node-list" id="list"></ul>

  <div class="editor" id="editor" style="display:none;">
    <h3>選択ノード</h3>

    <label>ID</label>
    <input id="editId" type="number" oninput="updateSelectedFromForm()">

    <label>floor_id</label>
    <input id="editFloor" type="text" value="1F" oninput="updateSelectedFromForm()">

    <label>x</label>
    <input id="editX" type="number" step="0.01" oninput="updateSelectedFromForm()">

    <label>y</label>
    <input id="editY" type="number" step="0.01" oninput="updateSelectedFromForm()">

    <label>type</label>
    <select id="editType" onchange="updateSelectedFromForm()">
      <option value="path">path</option>
      <option value="entrance_node">entrance_node</option>
      <option value="elevator">elevator</option>
      <option value="es_up">es_up</option>
      <option value="es_down">es_down</option>
      <option value="stairs">stairs</option>
      <option value="toilet_node">toilet_node</option>
      <option value="facility">facility</option>
    </select>

    <label>name</label>
    <input id="editName" type="text" oninput="updateSelectedFromForm()">
  </div>
</div>

<div class="map">
  <div class="map-wrap" id="wrap">
    <img src="./floor1.png" id="img" alt="館内図">
  </div>
</div>

<script>
let nodes = [];
let selectedId = null;
let isAddMode = false;
let draggingId = null;

const wrap = document.getElementById("wrap");
const img = document.getElementById("img");
const list = document.getElementById("list");
const editor = document.getElementById("editor");

window.addEventListener("load", loadNodes);

function loadNodes(){
  fetch("./nodes_1f.csv")
    .then(r => {
      if (!r.ok) throw new Error("nodes_1f.csv を読み込めませんでした");
      return r.text();
    })
    .then(text => {
      nodes = parseCsv(text).map(row => ({
        id: Number(row.id),
        floor_id: row.floor_id || "1F",
        x: Number(row.x),
        y: Number(row.y),
        type: row.type || "path",
        name: row.name || ""
      })).filter(n => Number.isFinite(n.id) && Number.isFinite(n.x) && Number.isFinite(n.y));

      selectedId = nodes.length ? nodes[0].id : null;
      isAddMode = false;
      wrap.classList.remove("crosshair");
      render();
    })
    .catch(err => {
      alert(err.message + "\n同じフォルダに nodes_1f.csv があるか確認してください。");
    });
}

function parseCsv(text){
  const lines = text.trim().replace(/\r/g, "").split("\n").filter(Boolean);
  const headers = splitCsvLine(lines.shift()).map(h => h.trim().replace(/^\uFEFF/, ""));

  return lines.map(line => {
    const values = splitCsvLine(line);
    const row = {};
    headers.forEach((h, i) => row[h] = (values[i] || "").trim());
    return row;
  });
}

function splitCsvLine(line){
  const result = [];
  let current = "";
  let inQuotes = false;

  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    const next = line[i + 1];

    if (ch === '"' && inQuotes && next === '"') {
      current += '"';
      i++;
    } else if (ch === '"') {
      inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      result.push(current);
      current = "";
    } else {
      current += ch;
    }
  }

  result.push(current);
  return result;
}

function render(){
  document.querySelectorAll(".node,.node-label").forEach(el => el.remove());

  nodes.forEach(n => {
    const d = document.createElement("div");
    d.className = `node ${n.type}`;
    if (n.id === selectedId) d.classList.add("active");
    d.style.left = n.x + "%";
    d.style.top = n.y + "%";
    d.title = `${n.id}: ${n.name}`;

    d.addEventListener("mousedown", e => {
      e.preventDefault();
      e.stopPropagation();
      draggingId = n.id;
      selectedId = n.id;
      render();
    });

    d.addEventListener("click", e => {
      e.stopPropagation();
      selectedId = n.id;
      render();
    });

    wrap.appendChild(d);

    const label = document.createElement("div");
    label.className = "node-label";
    label.style.left = n.x + "%";
    label.style.top = n.y + "%";
    label.textContent = `${n.id} ${n.name}`;
    wrap.appendChild(label);
  });

  renderList();
  renderForm();
}

function renderList(){
  list.innerHTML = "";

  nodes.slice().sort((a,b) => a.id - b.id).forEach(n => {
    const li = document.createElement("li");
    li.className = "node-item";
    if (n.id === selectedId) li.classList.add("active");
    li.onclick = () => {
      selectedId = n.id;
      render();
    };

    li.innerHTML = `
      <div class="node-title">${n.id}. ${escapeHtml(n.name || "名称なし")}</div>
      <div class="node-meta">${n.type} / x=${n.x.toFixed(2)}, y=${n.y.toFixed(2)}</div>
    `;

    list.appendChild(li);
  });
}

function renderForm(){
  const n = nodes.find(x => x.id === selectedId);
  if (!n) {
    editor.style.display = "none";
    return;
  }

  editor.style.display = "block";
  document.getElementById("editId").value = n.id;
  document.getElementById("editFloor").value = n.floor_id;
  document.getElementById("editX").value = round2(n.x);
  document.getElementById("editY").value = round2(n.y);
  document.getElementById("editType").value = n.type;
  document.getElementById("editName").value = n.name;
}

function updateSelectedFromForm(){
  const n = nodes.find(x => x.id === selectedId);
  if (!n) return;

  const newId = Number(document.getElementById("editId").value);
  if (Number.isFinite(newId)) {
    n.id = newId;
    selectedId = newId;
  }

  n.floor_id = document.getElementById("editFloor").value.trim() || "1F";
  n.x = Number(document.getElementById("editX").value);
  n.y = Number(document.getElementById("editY").value);
  n.type = document.getElementById("editType").value;
  n.name = document.getElementById("editName").value.trim();

  render();
}

function addMode(){
  isAddMode = true;
  wrap.classList.add("crosshair");
  alert("地図上をクリックすると、新しいノードを追加します。");
}

wrap.addEventListener("click", e => {
  if (!isAddMode) return;

  const pos = getMapPosition(e);
  const nextId = nodes.length ? Math.max(...nodes.map(n => n.id)) + 1 : 1;

  nodes.push({
    id: nextId,
    floor_id: "1F",
    x: pos.x,
    y: pos.y,
    type: "path",
    name: `追加ノード${nextId}`
  });

  selectedId = nextId;
  isAddMode = false;
  wrap.classList.remove("crosshair");
  render();
});

window.addEventListener("mousemove", e => {
  if (draggingId === null) return;

  const n = nodes.find(x => x.id === draggingId);
  if (!n) return;

  const pos = getMapPosition(e);
  n.x = pos.x;
  n.y = pos.y;
  selectedId = n.id;
  render();
});

window.addEventListener("mouseup", () => {
  draggingId = null;
});

function getMapPosition(e){
  const rect = img.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * 100;
  const y = ((e.clientY - rect.top) / rect.height) * 100;

  return {
    x: Math.max(0, Math.min(100, x)),
    y: Math.max(0, Math.min(100, y))
  };
}

function deleteSelected(){
  if (selectedId === null) return;
  const n = nodes.find(x => x.id === selectedId);
  if (!n) return;

  if (!confirm(`${n.id}. ${n.name} を削除しますか？`)) return;

  nodes = nodes.filter(x => x.id !== selectedId);
  selectedId = nodes.length ? nodes[0].id : null;
  render();
}

function exportCSV(){
  const sorted = nodes.slice().sort((a,b) => a.id - b.id);
  let csv = "id,floor_id,x,y,type,name\n";

  sorted.forEach(n => {
    csv += [
      n.id,
      csvEscape(n.floor_id),
      round2(n.x),
      round2(n.y),
      csvEscape(n.type),
      csvEscape(n.name)
    ].join(",") + "\n";
  });

  const blob = new Blob(["\uFEFF" + csv], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nodes_1f.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

function csvEscape(value){
  const s = String(value ?? "");
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}

function escapeHtml(value){
  return String(value).replace(/[&<>"]/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;"
  }[ch]));
}

function round2(value){
  return Math.round(Number(value) * 100) / 100;
}
</script>

</body>
</html>
